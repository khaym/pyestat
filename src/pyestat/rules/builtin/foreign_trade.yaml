# Foreign trade — commodity by country (statsCode 00350300, 普通貿易統計).
#
# Per-row value type is conditional on cat02 (unit / quantity / amount;
# see DESIGN.md Context). MVP rule schema cannot express that, so
# value.type stays "number": numeric cells parse normally, and the
# unit-symbol cells ("ＮＯ", "ＫＧ", ...) flow through ValueCaster
# unchanged because they are not coercible. Promote to the conditional
# schema (Decision D expansion) once it lands.
schema_version: "1"
match:
  statsCode: "00350300"
axes:
  time:
    id: time
    format: yearly
  area:
    id: area
value:
  type: number
