# Quarterly GDP (statsCode 00100409, 国民経済計算).
#
# GDP tables have no area axis; the schema's optional ``axes.area``
# section is intentionally omitted to keep the rule honest.
schema_version: "1"
match:
  statsCode: "00100409"
axes:
  time:
    id: time
    format: quarterly_e_stat
value:
  type: number
